name: pob2_ui
description: "Независимый интерфейс PoB PoE2 с исходными расчётами Lua"
publish_to: 'none'
version: 0.1.5+6

environment:
  sdk: ^3.13.7

dependencies:
  file_selector: 1.1.0
  flutter:
    sdk: flutter
  flutter_bloc: 9.1.1
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_test:
    sdk: flutter

flutter:
  generate: true
  uses-material-design: true
  assets:
    - docs/assets/brand/app-icon.svg
    - docs/assets/fonts/OFL-nunito.txt
    - docs/assets/fonts/OFL-nunitosans.txt
    - docs/assets/fonts/OFL-jetbrainsmono.txt
    - docs/assets/fonts/OFL-noto-cjk.txt
    - docs/assets/fonts/OFL-noto-thai.txt
  fonts:
    - family: Nunito
      fonts:
        - asset: docs/assets/fonts/nunito-800.ttf
          weight: 800
    - family: Nunito Sans
      fonts:
        - asset: docs/assets/fonts/nunito-sans-400.ttf
        - asset: docs/assets/fonts/nunito-sans-700.ttf
          weight: 700
    - family: JetBrains Mono
      fonts:
        - asset: docs/assets/fonts/jetbrains-mono-400.ttf
    - family: Noto CJK
      fonts:
        - asset: docs/assets/fonts/noto-sans-cjk-jp-400.otf
    - family: Noto Thai
      fonts:
        - asset: docs/assets/fonts/noto-sans-thai.ttf

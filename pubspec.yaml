name: pob2_ui
description: "Независимый интерфейс PoB PoE2 с исходными расчётами Lua"
publish_to: 'none'
version: 1.0.5+54

environment:
  sdk: ^3.14.0
  flutter: '>=3.50.0'

dependencies:
  archive: 4.5.2
  crypto: ^3.0.8
  file_selector: 1.1.0
  flutter:
    sdk: flutter
  flutter_bloc: 9.1.1
  flutter_localizations:
    sdk: flutter
  fixnum: 1.1.1
  grpc: 5.2.0
  intl: ^0.20.3
  material_ui: ^1.11.1
  path: 1.9.1
  pob2_engine_api:
    path: packages/pob2_engine_api
  posix: ^6.5.2
  xml: 7.1.0

dependency_overrides:
  # http2 3.2.0 освобождает очереди при завершении с непрочитанными кадрами.
  # Убрать переопределение, когда grpc разрешит http2 3.2.0.
  http2: 3.2.0

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_test:
    sdk: flutter

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/item_art.json
    - docs/assets/brand/app-icon.svg
    - docs/assets/fonts/OFL-nunito.txt
    - docs/assets/fonts/OFL-nunitosans.txt
    - docs/assets/fonts/OFL-jetbrainsmono.txt
    - docs/assets/fonts/OFL-noto-cjk.txt
    - docs/assets/fonts/OFL-noto-thai.txt
  fonts:
    - family: Nunito
      fonts:
        - asset: docs/assets/fonts/nunito-800.ttf
          weight: 800
    - family: Nunito Sans
      fonts:
        - asset: docs/assets/fonts/nunito-sans-400.ttf
        - asset: docs/assets/fonts/nunito-sans-700.ttf
          weight: 700
    - family: JetBrains Mono
      fonts:
        - asset: docs/assets/fonts/jetbrains-mono-400.ttf
    - family: Noto CJK
      fonts:
        - asset: docs/assets/fonts/noto-sans-cjk-jp-400.otf
    - family: Noto Thai
      fonts:
        - asset: docs/assets/fonts/noto-sans-thai.ttf

name: Проверки и установщики

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  desktop:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: windows-x64
            platform: windows
          - os: ubuntu-22.04
            target: linux-x64
            platform: linux
          - os: macos-15
            target: macos-arm64
            platform: macos
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Подготовить Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev xvfb
      - name: Загрузить закреплённый Flutter
        shell: bash
        run: |
          git clone --depth 1 --branch 3.47.9 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Зависимости
        run: flutter pub get
      - name: Форматирование
        run: dart format --output=none --set-exit-if-changed lib test tool
      - name: Анализ
        run: flutter analyze
      - name: Тесты приложения
        run: flutter test
      - name: Проверки релиза и прототипа
        shell: bash
        run: |
          python -m unittest discover -s tool -p 'test_*.py' -v
          python tool/release.py --check-only
          node --test tool/design_state_test.cjs
      - name: Собрать приложение
        run: flutter build ${{ matrix.platform }} --release
      - name: Собрать установщик
        run: python tool/release.py --package ${{ matrix.target }}
      - name: Проверить компоненты с настоящим Lua
        env:
          POB2_UI_HOME: ${{ runner.temp }}/pob2-lua-smoke
          POB2_GITHUB_TOKEN: ${{ github.token }}
        run: dart run tool/smoke.dart --install
      - name: Проверить установку и настоящий запуск
        if: runner.os == 'Linux'
        run: xvfb-run -a python tool/check_installer.py --target ${{ matrix.target }}
      - name: Проверить установку и настоящий запуск
        if: runner.os != 'Linux'
        run: python tool/check_installer.py --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: installer-${{ matrix.target }}
          path: build/packages/*
          if-no-files-found: error
          retention-days: 14

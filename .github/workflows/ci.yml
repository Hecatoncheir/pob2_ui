name: Проверки и установщики

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      locked_components:
        description: 'Проверить пару из tool/components-lock.json'
        type: boolean
        default: false
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
      locked_components:
        type: boolean
        default: false

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

jobs:
  complexity:
    name: Когнитивная сложность Dart
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'
      - uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7
        with:
          neovim: true
          version: v0.11.5
      - name: Проверить предел 10 и показать рост сложности
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REF_TYPE: ${{ github.ref_type }}
          EVENT: ${{ github.event_name }}
        run: |
          if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]]; then
            BASE=''
            if [[ "$EVENT" == push && "$REF_TYPE" == branch ]]; then
              BASE=$(git merge-base HEAD "origin/$DEFAULT_BRANCH")
            fi
          fi
          if [[ -n "$BASE" ]]; then
            git cat-file -e "$BASE^{commit}" 2>/dev/null || git fetch --depth=1 origin "$BASE"
            python tool/check_complexity.py --base "$BASE"
          else
            python tool/check_complexity.py
          fi
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: complexity-report
          path: |
            build/complexity/report.json
            build/complexity/changes.json

  desktop:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: windows-x64
            platform: windows
          - os: ubuntu-22.04
            target: linux-x64
            platform: linux
          - os: macos-15
            target: macos-arm64
            platform: macos
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Подготовить Linux
        if: runner.os == 'Linux'
        shell: bash
        timeout-minutes: 8
        run: |
          sources="$RUNNER_TEMP/pob-ubuntu.list"
          apt_options=(-o "Dir::Etc::sourcelist=$sources" -o Dir::Etc::sourceparts=- -o Acquire::Retries=0 -o Acquire::https::Timeout=10)
          packages=(clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev xvfb)
          for mirror in https://mirrors.edge.kernel.org/ubuntu https://archive.ubuntu.com/ubuntu; do
            for suite in jammy jammy-updates jammy-security; do
              printf 'deb %s %s main universe\n' "$mirror" "$suite"
            done > "$sources"
            if timeout 90s sudo apt-get "${apt_options[@]}" update --error-on=any &&
               timeout 90s sudo apt-get "${apt_options[@]}" install -y --download-only "${packages[@]}"; then
              sudo apt-get "${apt_options[@]}" install -y --no-download "${packages[@]}"
              exit 0
            fi
          done
          exit 1
      - name: Загрузить закреплённый Flutter
        shell: bash
        run: |
          git clone --depth 1 --branch 3.50.0 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Зависимости
        run: flutter pub get
      - name: Форматирование
        run: dart format --output=none --set-exit-if-changed lib test tool integration_test test_driver
      - name: Проверить перенос SVG
        shell: bash
        run: |
          python tool/generate_vectors.py
          dart format lib/ui/core/vector_drawings.dart
          git diff --exit-code -- lib/ui/core/vector_drawings.dart
      - name: Анализ
        run: flutter analyze
      - name: Проверить каталоги языков
        shell: bash
        run: |
          python tool/localize_ui.py
          flutter gen-l10n
          dart format lib/l10n lib/ui/core/ui_messages.g.dart
          git diff --exit-code -- lib/l10n lib/ui/core/ui_messages.g.dart
      - name: Тесты приложения
        run: flutter test
      - name: Проверки релиза и прототипа
        shell: bash
        run: |
          python -m unittest discover -s tool -p 'test_*.py' -v
          python tool/release.py --check-only
          node --test tool/design_state_test.cjs
      - name: Собрать приложение
        run: flutter build ${{ matrix.platform }} --release
      - name: Собрать установщик
        run: python tool/release.py --package ${{ matrix.target }}
      - name: Проверить компоненты с настоящим Lua
        shell: bash
        env:
          POB2_UI_HOME: ${{ runner.temp }}/pob2-lua-smoke
          POB2_GITHUB_TOKEN: ${{ github.token }}
          LOCKED_COMPONENTS: ${{ inputs.locked_components || false }}
        run: |
          set -o pipefail
          mkdir -p build/review
          args=(--install)
          if [[ "$LOCKED_COMPONENTS" == true ]]; then
            test -f tool/components-lock.json
            args+=(--lock tool/components-lock.json)
          fi
          dart run tool/smoke.dart "${args[@]}" | tee build/review/components.json
      - name: Проверить установку и восстановление сборки с Lua
        if: runner.os == 'Linux'
        run: xvfb-run -a python tool/check_installer.py --target ${{ matrix.target }} --components "${{ runner.temp }}/pob2-lua-smoke/components.json"
      - name: Проверить установку и восстановление сборки с Lua
        if: runner.os != 'Linux'
        run: python tool/check_installer.py --target ${{ matrix.target }} --components "${{ runner.temp }}/pob2-lua-smoke/components.json"
      - name: Новый интерфейс с настоящим Lua
        if: runner.os != 'Linux'
        env:
          POB2_UI_HOME: ${{ runner.temp }}/pob2-lua-smoke
          POB2_UI_SCREENSHOT: ${{ github.workspace }}/build/review/flutter-${{ matrix.platform }}.png
        run: flutter test integration_test/workspace_test.dart -d ${{ matrix.platform }} --no-pub
      - name: Новый интерфейс с настоящим Lua
        if: runner.os == 'Linux'
        env:
          POB2_UI_HOME: ${{ runner.temp }}/pob2-lua-smoke
          POB2_UI_SCREENSHOT: ${{ github.workspace }}/build/review/flutter-linux.png
        run: xvfb-run -a flutter test integration_test/workspace_test.dart -d linux --no-pub
      - name: Редакторы умений и условий с настоящим Lua
        if: runner.os != 'Linux'
        env:
          POB2_UI_HOME: ${{ runner.temp }}/pob2-lua-smoke
          POB2_UI_SCREENSHOT: ${{ github.workspace }}/build/review/editors-${{ matrix.platform }}.png
        run: flutter test integration_test/editors_test.dart -d ${{ matrix.platform }} --no-pub
      - name: Редакторы умений и условий с настоящим Lua
        if: runner.os == 'Linux'
        env:
          POB2_UI_HOME: ${{ runner.temp }}/pob2-lua-smoke
          POB2_UI_SCREENSHOT: ${{ github.workspace }}/build/review/editors-linux.png
        run: xvfb-run -a flutter test integration_test/editors_test.dart -d linux --no-pub
      - name: Редактор экипировки с настоящим Lua
        if: runner.os != 'Linux'
        env:
          POB2_UI_HOME: ${{ runner.temp }}/pob2-lua-smoke
          POB2_UI_SCREENSHOT: ${{ github.workspace }}/build/review/equipment-${{ matrix.platform }}.png
        run: flutter test integration_test/equipment_test.dart -d ${{ matrix.platform }} --no-pub
      - name: Редактор экипировки с настоящим Lua
        if: runner.os == 'Linux'
        env:
          POB2_UI_HOME: ${{ runner.temp }}/pob2-lua-smoke
          POB2_UI_SCREENSHOT: ${{ github.workspace }}/build/review/equipment-linux.png
        run: xvfb-run -a flutter test integration_test/equipment_test.dart -d linux --no-pub
      - name: Проверить переключение Release → Debug
        if: runner.os == 'Windows'
        shell: bash
        run: python tool/check_windows_engine.py --flutter-root "$RUNNER_TEMP/flutter"
      - name: Правки открытой сборки через MCP и Undo/Redo
        if: runner.os != 'Linux'
        env:
          POB2_UI_HOME: ${{ runner.temp }}/pob2-lua-smoke
          POB2_UI_REQUIRE_SKILL_CONTROLS: ${{ inputs.locked_components || false }}
        run: flutter test integration_test/mcp_editor_test.dart -d ${{ matrix.platform }} --no-pub
      - name: Правки открытой сборки через MCP и Undo/Redo
        if: runner.os == 'Linux'
        env:
          POB2_UI_HOME: ${{ runner.temp }}/pob2-lua-smoke
          POB2_UI_REQUIRE_SKILL_CONTROLS: ${{ inputs.locked_components || false }}
        run: xvfb-run -a flutter test integration_test/mcp_editor_test.dart -d linux --no-pub
      - name: Проверить сохранение окна
        if: runner.os == 'Windows'
        run: python -X utf8 tool/check_window_state.py
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: ui-${{ matrix.target }}
          path: |
            build/review/*.png
            build/review/components.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: installer-${{ matrix.target }}
          path: build/packages/*
          if-no-files-found: error
          retention-days: 14

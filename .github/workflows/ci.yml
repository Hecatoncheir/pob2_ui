name: Проверки и установщики

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      locked_components:
        description: 'Проверить пару из tool/components-lock.json'
        type: boolean
        default: false
      engine_release:
        description: 'Тег движка для сквозной проверки общей сборки'
        type: string
        default: ''
      engine_support:
        description: 'Проверить предпросмотр и применение поддержки в общей сборке'
        type: boolean
        default: false
      engine_equipment:
        description: 'Проверить примерку экипировки в общей сборке'
        type: boolean
        default: false
      engine_tree:
        description: 'Проверить правку дерева в общей сборке'
        type: boolean
        default: false
      engine_attributes:
        description: 'Проверить выбор и смену атрибута пассива в общей сборке'
        type: boolean
        default: false
      engine_weapon_modes:
        description: 'Проверить ветви оружия в общей сборке PoB II'
        type: boolean
        default: false
      engine_workshop:
        description: 'Проверить штатное дерево, редакторы, заметки и историю общей сборки'
        type: boolean
        default: false
      cold_install:
        description: 'Проверить первый запуск без предварительной загрузки архивов'
        type: boolean
        default: false
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
      engine_release:
        type: string
        default: ''
      engine_workshop:
        type: boolean
        default: false
      locked_components:
        type: boolean
        default: false

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

jobs:
  complexity:
    name: Когнитивная сложность Dart
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.15'
      - uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7
        with:
          neovim: true
          version: v0.12.6
      - name: Проверить предел 10 и показать рост сложности
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REF_TYPE: ${{ github.ref_type }}
          EVENT: ${{ github.event_name }}
        run: |
          if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]]; then
            BASE=''
            if [[ "$EVENT" == push && "$REF_TYPE" == branch ]]; then
              BASE=$(git merge-base HEAD "origin/$DEFAULT_BRANCH")
            fi
          fi
          if [[ -n "$BASE" ]]; then
            git cat-file -e "$BASE^{commit}" 2>/dev/null || git fetch --depth=1 origin "$BASE"
            python tool/check_complexity.py --base "$BASE"
          else
            python tool/check_complexity.py
          fi
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: complexity-report
          path: |
            build/complexity/report.json
            build/complexity/changes.json

  desktop:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: windows-x64
            platform: windows
          - os: ubuntu-22.04
            target: linux-x64
            platform: linux
          - os: macos-15
            target: macos-arm64
            platform: macos
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.15'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26'
      - name: Подготовить Linux
        if: runner.os == 'Linux'
        shell: bash
        timeout-minutes: 8
        run: |
          sources="$RUNNER_TEMP/pob-ubuntu.list"
          apt_options=(-o "Dir::Etc::sourcelist=$sources" -o Dir::Etc::sourceparts=- -o Acquire::Retries=0 -o Acquire::https::Timeout=10)
          packages=(clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev xvfb)
          for mirror in https://mirrors.edge.kernel.org/ubuntu https://archive.ubuntu.com/ubuntu; do
            for suite in jammy jammy-updates jammy-security; do
              printf 'deb %s %s main universe\n' "$mirror" "$suite"
            done > "$sources"
            if timeout 90s sudo apt-get "${apt_options[@]}" update --error-on=any &&
               timeout 90s sudo apt-get "${apt_options[@]}" install -y --download-only "${packages[@]}"; then
              sudo apt-get "${apt_options[@]}" install -y --no-download "${packages[@]}"
              exit 0
            fi
          done
          exit 1
      - name: Загрузить закреплённый Flutter
        shell: bash
        run: |
          git clone --depth 1 --branch 3.50.0 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Зависимости
        run: flutter pub get
      - name: Форматирование
        run: dart format --output=none --set-exit-if-changed lib test tool integration_test test_driver
      - name: Проверить перенос SVG
        shell: bash
        run: |
          python tool/generate_vectors.py
          dart format lib/ui/core/vector_drawings.dart
          git diff --exit-code -- lib/ui/core/vector_drawings.dart
      - name: Анализ
        run: flutter analyze
      - name: Проверить каталоги языков
        shell: bash
        run: |
          python tool/localize_ui.py
          flutter gen-l10n
          dart format lib/l10n lib/ui/core/ui_messages.g.dart
          git diff --exit-code -- lib/l10n lib/ui/core/ui_messages.g.dart
      - name: Проверить компоненты с настоящим Lua
        if: inputs.cold_install != true
        shell: bash
        env:
          POB2_UI_HOME: ${{ runner.temp }}/pob2-lua-smoke
          POB2_GITHUB_TOKEN: ${{ github.token }}
          LOCKED_COMPONENTS: ${{ inputs.locked_components || false }}
        run: |
          set -o pipefail
          mkdir -p build/review
          args=(--install --keep-archives)
          if [[ "$LOCKED_COMPONENTS" == true ]]; then
            test -f tool/components-lock.json
            args+=(--lock tool/components-lock.json)
          fi
          dart run tool/smoke.dart "${args[@]}" | tee build/review/components.json
      - name: Загрузить комплектный движок
        shell: bash
        env:
          ENGINE_TAG: ${{ inputs.engine_release }}
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.target }}
        run: |
          ENGINE_TAG="${ENGINE_TAG:-$(cat tool/engine-release.txt)}"
          [[ "$ENGINE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]
          case "$TARGET" in
            windows-x64) suffix=windows_amd64.exe ;;
            linux-x64) suffix=linux_amd64 ;;
            macos-arm64) suffix=darwin_arm64 ;;
            *) exit 1 ;;
          esac
          binary="pob2_engine_${ENGINE_TAG}_$suffix"
          engine_dir="$RUNNER_TEMP/shared-engine"
          gh release download "$ENGINE_TAG" --repo Hecatoncheir/pob2_engine \
            --pattern "$binary" --pattern SHA256SUMS --dir "$engine_dir"
          python - "$engine_dir" "$binary" <<'PY'
          from hashlib import sha256
          from pathlib import Path
          from sys import argv

          root, name = Path(argv[1]), argv[2]
          expected = dict(
              (filename.lstrip('*'), digest)
              for digest, filename in (line.split() for line in (root / 'SHA256SUMS').read_text().splitlines())
          )
          if sha256((root / name).read_bytes()).hexdigest() != expected[name]:
              raise SystemExit('Не совпадает SHA-256 движка')
          PY
          chmod +x "$engine_dir/$binary"
          echo "POB2_PACKAGED_ENGINE=$engine_dir/$binary" >> "$GITHUB_ENV"
          echo "POB2_PACKAGED_ENGINE_VERSION=$ENGINE_TAG" >> "$GITHUB_ENV"
      - name: Проверить общую XML-сборку с опубликованным движком
        if: inputs.cold_install != true
        shell: bash
        env:
          POB2_ENGINE_TEST_SUPPORT: ${{ (inputs.engine_support || inputs.engine_workshop || !inputs.engine_release) && '1' || '0' }}
          POB2_ENGINE_TEST_EQUIPMENT: ${{ (inputs.engine_equipment || inputs.engine_workshop || !inputs.engine_release) && '1' || '0' }}
          POB2_ENGINE_TEST_TREE: ${{ (inputs.engine_tree || inputs.engine_workshop || !inputs.engine_release) && '1' || '0' }}
          POB2_ENGINE_TEST_ATTRIBUTES: ${{ (inputs.engine_attributes || inputs.engine_workshop || !inputs.engine_release) && '1' || '0' }}
          POB2_ENGINE_TEST_WEAPON_MODES: ${{ (inputs.engine_weapon_modes || inputs.engine_workshop || !inputs.engine_release) && '1' || '0' }}
          POB2_ENGINE_TEST_SOCKETS: ${{ (inputs.engine_workshop || !inputs.engine_release) && '1' || '0' }}
          POB2_ENGINE_TEST_JEWELS: ${{ (inputs.engine_workshop || !inputs.engine_release) && '1' || '0' }}
          POB2_ENGINE_TEST_TREE_SPECS: ${{ (inputs.engine_workshop || !inputs.engine_release) && '1' || '0' }}
          POB2_ENGINE_TEST_TREE_CLASS: ${{ (inputs.engine_workshop || !inputs.engine_release) && '1' || '0' }}
          POB2_ENGINE_TEST_WORKSHOP: ${{ (inputs.engine_workshop || !inputs.engine_release) && '1' || '0' }}
          POB2_ENGINE_TEST_WORKSHOP_READS: ${{ (inputs.engine_workshop || !inputs.engine_release) && '1' || '0' }}
          POB2_ENGINE_TEST_WORKSHOP_TEXTURES: ${{ (inputs.engine_workshop || !inputs.engine_release) && '1' || '0' }}
          POB2_ENGINE_TEST_WORKSHOP_FORMS: ${{ (inputs.engine_workshop || !inputs.engine_release) && '1' || '0' }}
          POB2_ENGINE_TEST_SKILL_CHOICE: ${{ (inputs.engine_workshop || !inputs.engine_release) && '1' || '0' }}
          POB2_ENGINE_POB_GITHUB_TOKEN: ${{ github.token }}
          POB2_UI_HOME: ${{ runner.temp }}/pob2-lua-smoke
        run: |
          export POB2_ENGINE_TEST_EXECUTABLE="$POB2_PACKAGED_ENGINE"
          engine_dir="$(dirname "$POB2_ENGINE_TEST_EXECUTABLE")"
          "$POB2_ENGINE_TEST_EXECUTABLE" session create --profile ci-install --start-server \
            --runtime-dir "$engine_dir/runtime" --data-dir "$engine_dir/data" --timeout 120s \
            --session install --name CI --request-id install
          flutter test --no-pub test/engine_session_process_test.dart
          runner=()
          if [[ "$RUNNER_OS" == Linux ]]; then runner=(xvfb-run -a); fi
          "${runner[@]}" flutter test --no-pub integration_test/engine_session_desktop_test.dart -d "${{ matrix.platform }}"
      - name: Тесты приложения
        run: flutter test
      - uses: actions/setup-go@v7.1.0
        if: runner.os == 'Linux'
        with:
          go-version: '1.27.4'
      - uses: actions/checkout@v7.0.1
        if: runner.os == 'Linux'
        with:
          repository: Hecatoncheir/pob2_engine
          ref: 83b47dab660018c17237ead33a6392f99492dd56
          path: build/engine-source
      - name: Подготовить движок для процессного теста
        if: runner.os == 'Linux'
        working-directory: build/engine-source
        run: go build -o ../pob2-engine-test ./cmd/pob2-engine
      - name: Проверить общую сессию настоящими CLI и MCP
        if: runner.os == 'Linux'
        env:
          POB2_ENGINE_TEST_EXECUTABLE: ${{ github.workspace }}/build/pob2-engine-test
          POB2_ENGINE_CALCULATOR: go
        run: flutter test test/engine_session_process_test.dart
      - name: Проверки релиза и прототипа
        shell: bash
        run: |
          python -m unittest discover -s tool -p 'test_*.py' -v
          python tool/release.py --check-only
          node --test tool/design_state_test.cjs
      - name: Собрать приложение
        run: flutter build ${{ matrix.platform }} --release
      - name: Собрать установщик
        shell: bash
        run: |
          args=(--package ${{ matrix.target }})
          if [[ -n "${POB2_PACKAGED_ENGINE:-}" ]]; then
            args+=(--engine-binary "$POB2_PACKAGED_ENGINE" --engine-version "$POB2_PACKAGED_ENGINE_VERSION")
          fi
          python tool/release.py "${args[@]}"
      - name: Проверить выбор установленной версии загрузчиком
        if: runner.os != 'macOS'
        run: python tool/check_launcher.py --target ${{ matrix.target }}
      - name: Проверить игровые словари десяти языков
        if: inputs.cold_install != true
        shell: bash
        run: dart run tool/check_languages.dart "$RUNNER_TEMP/pob2-lua-smoke"
      - name: Скачать установщик v0.11.0 для проверки обновления
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v0.11.0 --dir build/previous --pattern '*${{ matrix.target }}*'
      - name: Проверить фактическое завершение через MCP
        if: inputs.cold_install != true
        shell: bash
        env:
          POB2_ENGINE_POB_GITHUB_TOKEN: ${{ github.token }}
        run: |
          runner=()
          if [[ "$RUNNER_OS" == Linux ]]; then runner=(xvfb-run -a); fi
          "${runner[@]}" python tool/check_mcp_lifecycle.py --target ${{ matrix.target }} \
            --components "$RUNNER_TEMP/pob2-lua-smoke/components.json" \
            --output build/review/mcp-lifecycle-${{ matrix.target }}.json
      - name: Проверить установку и восстановление сборки с Lua
        shell: bash
        env:
          COLD_INSTALL: ${{ inputs.cold_install || false }}
          LIVE_LINK: ${{ inputs.locked_components || false }}
          POB2_ENGINE_POB_GITHUB_TOKEN: ${{ github.token }}
        run: |
          runner=()
          if [[ "$RUNNER_OS" == Linux ]]; then runner=(xvfb-run -a); fi
          args=(--target ${{ matrix.target }} --build-check --previous build/previous)
          if [[ "$COLD_INSTALL" != true ]]; then
            args+=(--archives "$RUNNER_TEMP/pob2-lua-smoke/component-downloads")
          fi
          if [[ "$LIVE_LINK" == true ]]; then args+=(--verify-link); fi
          "${runner[@]}" python tool/check_installer.py "${args[@]}"
      - name: Нативные диалоги XML Windows и Linux
        if: inputs.cold_install != true && runner.os != 'macOS'
        shell: bash
        run: |
          runner=()
          binary=build/windows/x64/runner/Release/pob2_ui.exe
          if [[ "$RUNNER_OS" == Linux ]]; then
            runner=(xvfb-run -a)
            binary=build/linux/x64/release/bundle/pob2_ui
          fi
          "${runner[@]}" python tool/check_native_xml.py --binary "$binary" --components "$RUNNER_TEMP/pob2-lua-smoke/components.json"
      - name: Предпросмотр и очистка профиля
        if: inputs.cold_install != true
        shell: bash
        run: |
          runner=()
          if [[ "$RUNNER_OS" == Linux ]]; then runner=(xvfb-run -a); fi
          "${runner[@]}" flutter test integration_test/profile_cleanup_test.dart -d ${{ matrix.platform }} --no-pub
      - name: Сравнение путей дерева с настоящим Lua
        if: inputs.cold_install != true
        shell: bash
        env:
          POB2_UI_HOME: ${{ runner.temp }}/pob2-lua-smoke
          POB2_UI_SCREENSHOT: ${{ github.workspace }}/build/review/paths-${{ matrix.platform }}.png
        run: |
          runner=()
          if [[ "$RUNNER_OS" == Linux ]]; then runner=(xvfb-run -a); fi
          "${runner[@]}" flutter test integration_test/tree_path_comparison_test.dart -d ${{ matrix.platform }} --no-pub
      - name: Новый интерфейс с настоящим Lua
        if: inputs.cold_install != true && runner.os != 'Linux'
        env:
          POB2_UI_HOME: ${{ runner.temp }}/pob2-lua-smoke
          POB2_UI_SCREENSHOT: ${{ github.workspace }}/build/review/flutter-${{ matrix.platform }}.png
        run: flutter test integration_test/workspace_test.dart -d ${{ matrix.platform }} --no-pub
      - name: Новый интерфейс с настоящим Lua
        if: inputs.cold_install != true && runner.os == 'Linux'
        env:
          POB2_UI_HOME: ${{ runner.temp }}/pob2-lua-smoke
          POB2_UI_SCREENSHOT: ${{ github.workspace }}/build/review/flutter-linux.png
        run: xvfb-run -a flutter test integration_test/workspace_test.dart -d linux --no-pub
      - name: Редакторы умений и условий с настоящим Lua
        if: inputs.cold_install != true && runner.os != 'Linux'
        env:
          POB2_UI_HOME: ${{ runner.temp }}/pob2-lua-smoke
          POB2_UI_SCREENSHOT: ${{ github.workspace }}/build/review/editors-${{ matrix.platform }}.png
        run: flutter test integration_test/editors_test.dart -d ${{ matrix.platform }} --no-pub
      - name: Редакторы умений и условий с настоящим Lua
        if: inputs.cold_install != true && runner.os == 'Linux'
        env:
          POB2_UI_HOME: ${{ runner.temp }}/pob2-lua-smoke
          POB2_UI_SCREENSHOT: ${{ github.workspace }}/build/review/editors-linux.png
        run: xvfb-run -a flutter test integration_test/editors_test.dart -d linux --no-pub
      - name: Обмен кодами с исходным PoB
        if: inputs.cold_install != true && runner.os != 'Linux'
        env:
          POB2_UI_HOME: ${{ runner.temp }}/pob2-lua-smoke
        run: flutter test integration_test/share_codes_test.dart -d ${{ matrix.platform }} --no-pub
      - name: Обмен кодами с исходным PoB
        if: inputs.cold_install != true && runner.os == 'Linux'
        env:
          POB2_UI_HOME: ${{ runner.temp }}/pob2-lua-smoke
        run: xvfb-run -a flutter test integration_test/share_codes_test.dart -d linux --no-pub
      - name: Импорт ссылок pobb.in с настоящим Lua
        if: inputs.cold_install != true
        shell: bash
        env:
          POB2_UI_HOME: ${{ runner.temp }}/pob2-lua-smoke
        run: |
          runner=()
          if [[ "$RUNNER_OS" == Linux ]]; then runner=(xvfb-run -a); fi
          "${runner[@]}" flutter test integration_test/share_links_test.dart -d ${{ matrix.platform }} --no-pub \
            --dart-define=POB2_LIVE_SHARE_LINK=${{ inputs.locked_components || false }}
      - name: Редактор экипировки с настоящим Lua
        if: inputs.cold_install != true && runner.os != 'Linux'
        env:
          POB2_UI_HOME: ${{ runner.temp }}/pob2-lua-smoke
          POB2_UI_SCREENSHOT: ${{ github.workspace }}/build/review/equipment-${{ matrix.platform }}.png
        run: flutter test integration_test/equipment_test.dart -d ${{ matrix.platform }} --no-pub
      - name: Редактор экипировки с настоящим Lua
        if: inputs.cold_install != true && runner.os == 'Linux'
        env:
          POB2_UI_HOME: ${{ runner.temp }}/pob2-lua-smoke
          POB2_UI_SCREENSHOT: ${{ github.workspace }}/build/review/equipment-linux.png
        run: xvfb-run -a flutter test integration_test/equipment_test.dart -d linux --no-pub
      - name: Проверить переключение Release → Debug
        if: inputs.cold_install != true && runner.os == 'Windows'
        shell: bash
        run: python tool/check_windows_engine.py --flutter-root "$RUNNER_TEMP/flutter"
      - name: Правки открытой сборки через MCP и Undo/Redo
        if: inputs.cold_install != true && runner.os != 'Linux'
        env:
          POB2_UI_HOME: ${{ runner.temp }}/pob2-lua-smoke
          POB2_UI_REQUIRE_SKILL_CONTROLS: ${{ inputs.locked_components || false }}
        run: flutter test integration_test/mcp_editor_test.dart -d ${{ matrix.platform }} --no-pub
      - name: Правки открытой сборки через MCP и Undo/Redo
        if: inputs.cold_install != true && runner.os == 'Linux'
        env:
          POB2_UI_HOME: ${{ runner.temp }}/pob2-lua-smoke
          POB2_UI_REQUIRE_SKILL_CONTROLS: ${{ inputs.locked_components || false }}
        run: xvfb-run -a flutter test integration_test/mcp_editor_test.dart -d linux --no-pub
      - name: Названия предметов и десять языков с настоящим Lua
        if: inputs.cold_install != true
        shell: bash
        env:
          POB2_UI_HOME: ${{ runner.temp }}/pob2-lua-smoke
        run: |
          runner=()
          if [[ "$RUNNER_OS" == Linux ]]; then runner=(xvfb-run -a); fi
          "${runner[@]}" flutter test integration_test/item_names_test.dart -d ${{ matrix.platform }} --no-pub
      - name: Проверить сохранение окна
        if: inputs.cold_install != true && runner.os == 'Windows'
        run: python -X utf8 tool/check_window_state.py
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: ui-${{ matrix.target }}
          overwrite: true
          path: |
            build/review/*.png
            build/review/components.json
            build/review/mcp-lifecycle-*.json
            build/review/*installer-progress*.jsonl
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: installer-${{ matrix.target }}
          overwrite: true
          path: build/packages/*
          if-no-files-found: error
          retention-days: 14

name: Публикация релиза

on:
  push:
    tags: ['v1.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Существующий стабильный тег vX.Y.Z'
        type: string
        required: true

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.version.outputs.commit }}
      engine: ${{ steps.version.outputs.engine }}
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: Проверить линию выпуска 1.x
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v1\.[0-9]+\.[0-9]+$ ]] || { echo 'Нужен тег v1.X.Y'; exit 1; }
          git fetch origin 1.x.x
          git merge-base --is-ancestor HEAD origin/1.x.x || { echo 'Тег не входит в ветку 1.x.x'; exit 1; }
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.15'
      - id: version
        run: |
          python tool/release.py --tag "$RELEASE_TAG" --check-only
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          engine=$(cat tool/engine-release.txt)
          [[ "$engine" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "engine=$engine" >> "$GITHUB_OUTPUT"
  checks:
    needs: metadata
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.metadata.outputs.commit }}
      locked_components: true
      engine_release: ${{ needs.metadata.outputs.engine }}
      engine_workshop: true
  publish:
    needs: [metadata, checks]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.metadata.outputs.commit }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.RELEASE_COMMIT }}
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.15'
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: installer-*
          merge-multiple: true
          path: build/packages
      - name: Проверить комплект и записать SHA-256
        run: python tool/release.py --tag "$RELEASE_TAG" --artifacts build/packages
      - name: Опубликовать неизменяемый выпуск
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Выпуск уже существует; файлы не будут заменены.'
            exit 0
          fi
          tag_ref="refs/tags/$RELEASE_TAG"
          remote_commit=$(git ls-remote --exit-code origin "$tag_ref" "$tag_ref^{}" |
            awk '$2 ~ /\^\{\}$/ {peeled=$1; next} {direct=$1} END {print peeled ? peeled : direct}')
          if [[ "$remote_commit" != "$RELEASE_COMMIT" ]]; then
            echo 'Тег выпуска указывает на другой коммит.' >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" build/packages/*.exe build/packages/*.dmg build/packages/*.run build/packages/SHA256SUMS \
            --verify-tag --title "$RELEASE_TAG — PoB II" --notes-file build/packages/RELEASE_NOTES.md

  verify:
    name: Проверить скачанный установщик ${{ matrix.target }}
    needs: [metadata, publish]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: windows-x64
          - os: ubuntu-22.04
            target: linux-x64
          - os: macos-15
            target: macos-arm64
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
      TARGET: ${{ matrix.target }}
      POB2_PACKAGED_ENGINE_VERSION: ${{ needs.metadata.outputs.engine }}
      POB2_ENGINE_POB_GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.commit }}
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.15'
      - name: Подготовить Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libegl1 libegl-mesa0 libgles2
      - name: Скачать выпуск, сверить SHA-256 и проверить установку
        shell: bash
        run: |
          installer=$(python -c 'from tool.release import filename, version; import os; print(filename(version(), os.environ["TARGET"]))')
          gh release download "$RELEASE_TAG" --pattern "$installer" --pattern SHA256SUMS --dir published
          python - "$installer" <<'PY'
          from hashlib import file_digest
          from pathlib import Path
          from sys import argv

          root = Path("published")
          expected = {name.lstrip("*"): digest for digest, name in (line.split() for line in (root / "SHA256SUMS").read_text().splitlines())}
          package = root / argv[1]
          with package.open("rb") as stream:
              if file_digest(stream, "sha256").hexdigest() != expected[package.name]:
                  raise SystemExit("SHA-256 установщика не совпадает с выпуском")
          PY
          runner=()
          if [[ "$RUNNER_OS" == Linux ]]; then runner=(xvfb-run -a); fi
          "${runner[@]}" python tool/check_installer.py --target "$TARGET" --package "published/$installer" --build-check

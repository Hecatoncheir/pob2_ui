name: Сайт и дизайн-прототип

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'tool/design_state_test.cjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Проверка прототипа
        run: |
          node --test tool/design_state_test.cjs
          for script in docs/scripts/*.js; do
            node --check "$script"
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Публикация
        id: deployment
        uses: actions/deploy-pages@v4

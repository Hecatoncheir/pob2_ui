name: Сайт и галерея приложения

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'tool/design_state_test.cjs'
      - 'tool/site_downloads_test.cjs'
      - 'tool/update_site_release.cjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
  release:
    types: [published]
  workflow_run:
    workflows: ['Публикация релиза']
    types: [completed]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Обновить ссылки последнего выпуска
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tool/update_site_release.cjs
      - name: Проверка сайта
        run: |
          node --test tool/design_state_test.cjs
          node --test tool/site_downloads_test.cjs
          for script in docs/scripts/*.js; do
            node --check "$script"
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Публикация
        id: deployment
        uses: actions/deploy-pages@v4
